[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deepISA"
version = "0.1.0"
description = "A unified Python framework for mapping transcription factor cooperativity using deep learning and in silico ablation."
authors = [
    {name = "Xuening He", email = "xuening.he@bio.ku.com"}
]
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Intended Audience :: Science/Research",
]

# Core dependencies based on your module requirements 
dependencies = [
    "bioframe",
    "pyfaidx",                   # utils.load_fasta fallback engine (pysam is unavailable on Windows)
    "biopython>=1.80",
    "loguru",  
    "matplotlib",
    "numpy>=1.24.0",                                                                        
    "pyBigWig",
    "pysam",
    "pandas>=2.0.0",
    "requests",
    "scipy",
    "statsmodels",
    "scikit-learn",  
    "seaborn",
    "torch>=2.0.0",
    "tqdm", 
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",                # For the Phase 1/2 validation logic
]
# Motif discovery CLI backends. deepISA orchestrates these via subprocess; the
# Python side (attribution, NPZ/H5 building, hits parsing) works without them.
# Install only the one(s) you intend to run:
#   pip install -e ".[discover]"
discover = [
    "modisco-lite",               # provides the `modisco` CLI (pip package name)
    "finemo",                     # provides the `finemo` CLI (pip package name)
]
# AlphaGenome API backend for ISA scoring (optional). Get a free (non-commercial
# use) API key at https://deepmind.google.com/science/alphagenome:
#   pip install -e ".[alphagenome]"
alphagenome = [
    "alphagenome",                # provides AlphaGenomeAdapter (modeling/alpha_genome_adapter.py)
    "pyyaml",
]
discover = [
    "captum",
    "h5py>=3.0", 
    "tangermeme>=1.0",
    "modisco-lite",
]
all = [
    "deepISA[alphagenome,discover,dev]",
]


[tool.setuptools.packages.find]
where = ["src"]


[project.scripts]
deepisa-cli = "deepisa.main:main"